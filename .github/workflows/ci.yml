---
name: "CI Tests & Linting"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

"on":
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  APP_NAME: "nautobot-workflow-engine"
  PYTHON_VER: "3.12"
  NAUTOBOT_VER: "3.2.5"
  INVOKE_NAUTOBOT_WORKFLOW_ENGINE_PYTHON_VER: "3.12"
  INVOKE_NAUTOBOT_WORKFLOW_ENGINE_NAUTOBOT_VER: "3.2.5"

jobs:
  ruff:
    runs-on: "ubuntu-latest"
    env:
      INVOKE_NAUTOBOT_WORKFLOW_ENGINE_LOCAL: "True"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"

      - name: "Install Poetry"
        uses: "snok/install-poetry@v1"
        with:
          version: "1.8.5"
          virtualenvs-create: true

      - name: "Install dependencies"
        run: "poetry install --no-interaction --without docs"

      - name: "Linting: ruff"
        run: "poetry run invoke ruff"

  unittest:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"

      - name: "Install Poetry"
        uses: "snok/install-poetry@v1"
        with:
          version: "1.8.5"
          virtualenvs-create: true

      - name: "Install invoke"
        run: "poetry install --no-interaction --without docs"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Build Nautobot image"
        uses: "docker/build-push-action@v6"
        with:
          context: "./"
          push: false
          load: true
          tags: "${{ env.APP_NAME }}/nautobot:${{ env.NAUTOBOT_VER }}-py${{ env.PYTHON_VER }}"
          file: "./development/Dockerfile"
          cache-from: "type=gha,scope=${{ env.NAUTOBOT_VER }}-py${{ env.PYTHON_VER }}"
          cache-to: "type=gha,scope=${{ env.NAUTOBOT_VER }}-py${{ env.PYTHON_VER }},mode=max"
          build-args: |
            NAUTOBOT_VER=${{ env.NAUTOBOT_VER }}
            PYTHON_VER=${{ env.PYTHON_VER }}
            CI=true

      - name: "Copy credentials"
        run: "cp development/creds.example.env development/creds.env"

      - name: "Run unit tests"
        run: "poetry run invoke unittest --skip-docs-build"
