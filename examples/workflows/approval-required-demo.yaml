---
version: 1
key: "approval-required-demo"
name: "Approval Required Demo"
description: >
  Example workflow that opts into Nautobot 3.2+ Approval Workflow Definitions.
  After git sync, open Approvals → Workflow Definitions, find
  "Workflow Engine: approval-required-demo", and add at least one stage before launching.
category: "Examples"
enabled: true
approval_required: true
manual_duration_minutes: 5
inputs:
  - key: "message"
    label: "Message"
    type: "string"
    required: true
    default: "Approved run"
actions:
  - type: "nautobot"
    name: "echo"
    script: "scripts/echo_hostname.py"
    with:
      hostname: "{{ inputs.message }}"
